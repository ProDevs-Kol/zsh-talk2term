name: test
on: [push, pull_request]
jobs:
  zsh-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh jq
      - run: zsh -n talk2term.zsh
      - run: for t in tests/*.zsh; do echo "== $t"; zsh "$t"; done
